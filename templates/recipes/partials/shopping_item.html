<div 
    id="shopping-item-{{ item.id }}" 
    class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-stone-200 transition {% if item.is_checked %}opacity-50 bg-stone-50{% endif %}">
    <div class="flex items-center gap-3">
        <button 
            type="button"
            hx-post="{% url 'recipes:toggle_shopping_item' item.id %}"
            hx-target="#shopping-item-{{ item.id }}"
            hx-swap="outerHTML"
            aria-label="Tandai {{ item.item_name }} sebagai sudah dibeli"
            class="w-6 h-6 rounded-lg border flex items-center justify-center transition focus-visible:ring-2 focus-visible:ring-primary-600 {% if item.is_checked %}bg-primary-600 border-primary-600 text-white{% else %}border-stone-300 hover:border-primary-600 text-transparent{% endif %}">
            <span class="material-symbols-outlined text-sm">check</span>
        </button>
        <span class="text-sm font-medium {% if item.is_checked %}line-through text-stone-500{% else %}text-stone-800{% endif %}">
            {{ item.item_name }}
        </span>
    </div>

    <div class="flex items-center gap-3">
        <div class="text-xs font-semibold text-stone-600">
            {% if item.amount is not None %}
                {{ item.amount|floatformat:"-2" }}
            {% endif %}
            {{ item.unit|default:"" }}
        </div>

        <!-- Tombol Hapus per Item U9 -->
        <button 
            type="button"
            hx-post="{% url 'recipes:delete_shopping_item' item.id %}"
            hx-target="#shopping-item-{{ item.id }}"
            hx-swap="outerHTML swap:200ms"
            aria-label="Hapus {{ item.item_name }} dari daftar belanja"
            title="Hapus bahan"
            class="p-1.5 text-stone-400 hover:text-tertiary-600 hover:bg-stone-100 rounded-full transition focus-visible:ring-2 focus-visible:ring-tertiary-600">
            <span class="material-symbols-outlined text-base">delete</span>
        </button>
    </div>
</div>
